name: Build macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Скачиваем код
        uses: actions/checkout@v4

      - name: Ставим Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Ставим Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Собираем BloomeeTunes под macOS
        run: |
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release

      - name: Упаковываем готовое приложение
        run: |
          cd build/macos/Build/Products/Release
          ls -la
          zip -r -y BloomeeTunes-macOS.zip *.app

      - name: Выгружаем файл для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: BloomeeTunes-macOS
          path: build/macos/Build/Products/Release/BloomeeTunes-macOS.zip
